site_name: ModernCppAtlas
site_description: 从 C++11 到 C++26 的现代 C++ 特性图谱，附真实项目证据
site_author: ModernCppAtlas contributors
site_url: https://zyuhao7.github.io/ModernCppAtlas/
repo_url: https://github.com/zyuhao7/ModernCppAtlas
repo_name: zyuhao7/ModernCppAtlas
copyright: 正文与数据 CC BY 4.0 · 示例代码 MIT

docs_dir: .site-docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

not_in_nav: |
  /evidence/ev-*.md

extra:
  generator: false
