# Canonical feature categories.
#
# `groups` is the presentation order for the scenario index; the tags inside
# each group are the only values allowed in a feature's `category` field.
# schema/feature.schema.json mirrors this list and data/validate.py rejects
# drift between the two.
groups:
  语言与对象模型:
    - 语法
    - 初始化
    - 对象模型
    - 控制流
    - 面向对象
    - 语言机制
    - 比较
  类型系统:
    - 类型系统
    - 类型安全
    - 类型转换
    - 类型擦除
    - 类型工具
    - 类型推导
    - 值语义
    - 所有权
  模板与泛型:
    - 模板
    - 泛型编程
    - 概念
    - 元编程
    - 可变参数
  编译期计算:
    - 编译期计算
  并发:
    - 并发
    - 线程同步
    - 原子操作
    - 异步
  内存与资源:
    - 内存管理
    - RAII
    - 视图
  标准库:
    - 容器
    - 字符串
    - 算法
    - 范围
    - 格式化
    - 文件系统
    - 函数式
    - 错误处理
    - 诊断
    - 模块
    - 性能
