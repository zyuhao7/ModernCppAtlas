[project]
name = "modern-cpp-atlas-tools"
version = "0.1.0"
description = "Evidence pipeline and validation for ModernCppAtlas"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "tree-sitter>=0.25",
  "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
docs = [
    "jieba>=0.42",
    "mkdocs-material>=9.6",
]

[tool.uv]
package = false
