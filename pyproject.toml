[project]
name = "modern-cpp-atlas-tools"
version = "0.1.0"
description = "Evidence pipeline and validation for ModernCppAtlas"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "tree-sitter>=0.25",
  "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
docs = [
    "jieba>=0.42",
    "mkdocs-material>=9.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "clang-format==20.1.0",
    "mdformat>=0.7.22",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "mdformat-tables>=1.0.0",
    "ruff>=0.17.2",
]
