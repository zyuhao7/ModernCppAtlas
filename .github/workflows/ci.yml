name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install formatters
        run: uv sync --frozen --group dev

      - name: Check Python formatting
        run: |
          uv run ruff format --check tools tests
          uv run ruff check tools tests

      - name: Check C++ formatting
        run: uv run clang-format --dry-run --Werror examples/*/*.cpp

      - name: Check Markdown formatting
        run: uv run mdformat --check README.md todo.md data/features .github/pull_request_template.md

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen

      - name: Validate data contracts
        run: uv run tools/validate.py

      - name: Cache corpus checkouts
        uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('data/corpus.yaml') }}

      - name: Fetch pinned corpus
        run: uv run tools/fetch_corpus.py

      - name: Verify pinned evidence locations
        run: uv run tools/validate.py --check-corpus

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen

      - name: Run tool tests
        run: uv run python -m unittest discover -s tests -v

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen

      - name: Compile and run examples (${{ matrix.compiler }})
        run: uv run tools/verify_examples.py --compiler ${{ matrix.compiler }} --run

  site:
    needs: [format, validate, tests, examples]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen --extra docs

      - name: Generate site sources
        run: uv run tools/build_site.py

      - name: Build site
        run: uv run mkdocs build --strict

      - name: Check internal links
        run: uv run tools/check_links.py

      - name: Check Chinese search
        run: uv run tools/check_search.py

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
